apiVersion: v1
kind: Service
metadata:
  name: my-api-metrics
  namespace: default
  labels:
    monitoring: my-api
spec:
  selector:
    app: my-api
    monitoring: enabled
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-api
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  podTargetLabels:
    - rollouts-pod-template-hash
  selector:
    matchLabels:
      monitoring: my-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
