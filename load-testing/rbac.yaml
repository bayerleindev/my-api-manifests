apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k6-scheduler
rules:
  - apiGroups:
      - k6.io
    resources:
      - testruns
    verbs:
      - create
      - delete
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k6-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k6-scheduler
subjects:
  - kind: ServiceAccount
    name: k6-scheduler
