name: Generate Grafana dashboard ConfigMap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - argocd/monitoring/grafana/dashboards/**.json
      - argocd/monitoring/grafana/generate-kustomization.sh

permissions:
  contents: write

concurrency:
  group: grafana-dashboard-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar JSONs e atualizar Kustomize
        run: ./argocd/monitoring/grafana/generate-kustomization.sh

      - name: Commit da configuração gerada
        run: |
          if git diff --quiet -- argocd/monitoring/grafana/kustomization.yaml; then
            echo "A configuração já está atualizada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argocd/monitoring/grafana/kustomization.yaml
          git commit -m "chore: generate Grafana dashboard ConfigMap"
          git push
